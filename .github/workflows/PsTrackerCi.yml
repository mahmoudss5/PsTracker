name: psTrackerCi

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            back/.mvn/wrapper/maven-wrapper.properties

      - name: Build and test backend
        working-directory: back
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            back/target/surefire-reports/*.xml
            back/target/failsafe-reports/*.xml
          if-no-files-found: ignore

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front/icpc-tracker
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Front/icpc-tracker/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  image-smoke:
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build and start containers
        run: docker compose -f compose.ci.yml up -d --build

      - name: Check backend health
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --no-color

      - name: Remove test containers
        if: always()
        run: docker compose -f compose.ci.yml down -v
