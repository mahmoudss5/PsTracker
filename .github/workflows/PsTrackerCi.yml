name: psTrackerCi

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            back/pom.xml
            back/.mvn/wrapper/maven-wrapper.properties

      - name: Build and test backend
        working-directory: back
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            back/target/surefire-reports/*.xml
            back/target/failsafe-reports/*.xml
          if-no-files-found: ignore

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front/icpc-tracker
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Front/icpc-tracker/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  image-smoke:
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build and start containers
        run: docker compose -f compose.ci.yml up -d --build

      - name: Check backend health
        run: |
          for attempt in {1..40}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Check frontend and proxies
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 2 --retry-connrefused \
            http://localhost:8081/ | grep -F 'id="root"' >/dev/null

          status=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            http://localhost:8081/api/auth/refresh)

          test "$status" = "400"

          curl --fail --silent --show-error \
            http://localhost:8081/ws/info | jq -e '.websocket == true'

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set release image tag
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Push tested backend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          
          IMAGE_ID=$(docker compose -f compose.ci.yml images -q backend)
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          docker tag "$IMAGE_ID" "$IMAGE_URI"
          docker push "$IMAGE_URI"

      - name: Push tested frontend image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          
          IMAGE_ID=$(docker compose -f compose.ci.yml images -q frontend)
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          docker tag "$IMAGE_ID" "$IMAGE_URI"
          docker push "$IMAGE_URI"

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yml logs --no-color

      - name: Remove test containers
        if: always()
        run: docker compose -f compose.ci.yml down -v


  deploy:
    name: Deploy to EC2
    needs: image-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: pstracker-production
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ needs.image-smoke.outputs.image_tag }}
      DEPLOY_COMMIT: ${{ github.sha }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check deployment variables
        run: |
          set -euo pipefail
          : "${EC2_INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"
          : "${IMAGE_TAG:?The image-smoke job did not provide an image tag}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}