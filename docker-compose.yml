volumes:
  postgres_data:
  redis_data:
  maven_cache:
services:
  postgres:
    image: postgres:16-alpine
    container_name: pstracker_db
    environment:
      POSTGRES_DB: pstracker
      POSTGRES_USER: pstracker_user
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
     - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pstracker_user -d pstracker"]
      interval: 5s  # Check every 5 seconds
      timeout: 5s   # Wait up to 5 seconds for a response
      retries: 5    # If it fails 5 times in a row, consider it unhealthy
      start_period: 5s # Give Postgres 5 seconds of grace time to boot up initially

  redis:
    image: redis:7-alpine
    container_name: pstracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: pstracker_backend
    ports:
      - "8080:8080"
      - "5005:5005" # For remote debugging if needed
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/pstracker
      - DB_USERNAME=pstracker_user
      - DB_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=THIS_IS_A_VERY_LONG_SECRET_KEY_MINIMUM_32_CHARS
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - OTEL_SERVICE_NAME=observability-demo-api
      - OTEL_RESOURCE_ATTRIBUTES=service.version=1.0.0,deployment.environment.name=demo
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_METRIC_EXPORT_INTERVAL=5000
      - OTEL_TRACES_SAMPLER=parentbased_always_on
      # Demo: capture SLF4J 2.x .addKeyValue() as structured OTLP log attributes.
      # Explicitly include only demo app structured log attributes, not all keys.
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_KEY_VALUE_PAIR_ATTRIBUTES_INCLUDED=app.*

    volumes:
      - ./back:/app
      - maven_cache:/root/.m2 # Cache maven dependencies to speed up restarts
    depends_on:
      - postgres
      - redis
      - otel-collector
    restart: on-failure
    
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:

      image: prom/prometheus:v3.7.3
      command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --web.enable-remote-write-receiver
      volumes:
        - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      ports:
        - "9090:9090"

  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/mnt/config/loki-config.yaml"]
    volumes:
     - ./otel/loki-config.yaml:/mnt/config/loki-config.yaml:ro
    ports:
     - "3100:3100"

  tempo:
    image: grafana/tempo:2.9.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./otel/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4319:4317"

  grafana:
      image: grafana/grafana:12.1.0
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
      volumes:
        - ./otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      ports:
        - "3000:3000"
      depends_on:
        - prometheus
        - loki
        - tempo
  frontend:
    build:
      context: ./Front/icpc-tracker
      dockerfile: Dockerfile.dev
    container_name: pstracker_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    volumes:
      - ./Front/icpc-tracker:/app
      - /app/node_modules # Prevent local node_modules from overwriting container's
    depends_on:
      - backend
    restart: unless-stopped
