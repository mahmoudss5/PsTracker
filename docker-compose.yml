version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pstracker_db
    environment:
      POSTGRES_DB: pstracker
      POSTGRES_USER: pstracker_user
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pstracker_user -d pstracker"]
      interval: 5s  # Check every 5 seconds
      timeout: 5s   # Wait up to 5 seconds for a response
      retries: 5    # If it fails 5 times in a row, consider it unhealthy
      start_period: 5s # Give Postgres 5 seconds of grace time to boot up initially
  
  redis:
    image: redis:7-alpine
    container_name: pstracker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    container_name: pstracker_backend
    ports:
      - "8080:8080"
      - "5005:5005" # For remote debugging if needed
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/pstracker
      - DB_USERNAME=pstracker_user
      - DB_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=THIS_IS_A_VERY_LONG_SECRET_KEY_MINIMUM_32_CHARS
    volumes:
      - ./back:/app
      - maven_cache:/root/.m2 # Cache maven dependencies to speed up restarts
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./Front/icpc-tracker
      dockerfile: Dockerfile.dev
    container_name: pstracker_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    volumes:
      - ./Front/icpc-tracker:/app
      - /app/node_modules # Prevent local node_modules from overwriting container's
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  maven_cache:
  