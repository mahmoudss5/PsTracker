server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 20m;
    }

    location /ws {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 300s;
    }
    location /codeforces-api/ {
        proxy_pass https://codeforces.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host codeforces.com;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /codeforces-image/ {
        proxy_pass https://userpic.codeforces.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host userpic.codeforces.org;
        proxy_set_header Referer https://codeforces.com/;
        proxy_set_header User-Agent $http_user_agent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
