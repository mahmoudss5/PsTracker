server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /codeforces-api/ {
        proxy_pass https://codeforces.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host codeforces.com;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /codeforces-image/ {
        proxy_pass https://userpic.codeforces.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host userpic.codeforces.org;
        proxy_set_header Referer https://codeforces.com/;
        proxy_set_header User-Agent $http_user_agent;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
