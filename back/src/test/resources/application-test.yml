spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false

jwt:
  secret: test-only-jwt-secret-that-is-long-enough

aws:
  access-key-id: test-access-key
  secret-access-key: test-secret-key
  region: us-east-1
  bucket-name: test-bucket

app:
  codeforces-base-url: https://codeforces.test/api
  swagger-server-url: http://localhost:8080
  trusted-proxy-addresses: ""
  cors-allowed-origins:
    - http://localhost:5173
    - http://localhost:5174
