spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pstracker}
    username: ${DB_USERNAME:pstracker_user}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
   redis:
     host: localhost
     port: 6379
     timeout: 10000

  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:dbMigration


jwt:
  secret: ${JWT_SECRET:THIS_IS_A_VERY_LONG_SECRET_KEY_MINIMUM_32_CHARS}
  access-expiration: 900000
  refresh-expiration: 604800000