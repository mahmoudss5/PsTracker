spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pstracker}
    username: ${DB_USERNAME:pstracker_user}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
   redis:
     host: localhost
     port: 6379
     timeout: 10000

  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:dbMigration


jwt:
  secret: ${JWT_SECRET:THIS_IS_A_VERY_LONG_SECRET_KEY_MINIMUM_32_CHARS}
  access-expiration: 900000
  refresh-expiration: 604800000

server:
  shutdown: graceful

app:
  codeforces-base-url: ${CODEFORCES_BASE_URL}
  swagger-server-url: ${SWAGGER_SERVER_URL}
  trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES}
  cors-allowed-origins:
    - ${FRONTEND_ORIGIN_1}
    - ${FRONTEND_ORIGIN_2}
    - ${FRONTEND_ORIGIN_3}
    - ${FRONTEND_ORIGIN_4}
    - ${FRONTEND_ORIGIN_5}
aws:
  access-key-id: ${AWS_ACCESS_KEY_ID}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY}
  region: ${AWS_REGION}
  bucket-name: ${AWS_BUCKET_NAME}
