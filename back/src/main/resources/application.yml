spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pstracker}
    username: ${DB_USERNAME:pstracker_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  data:
   redis:
     host: localhost
     port: 6379
     timeout: 10000

  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:dbMigration


jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000
  refresh-expiration: 604800000

server:
  shutdown: graceful

app:
  codeforces-base-url: ${CODEFORCES_BASE_URL}
  swagger-server-url: ${SWAGGER_SERVER_URL}
  trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:100}
    period-seconds: ${RATE_LIMIT_PERIOD_SECONDS:60}
  cors-allowed-origins:
    - ${FRONTEND_ORIGIN_1}
    - ${FRONTEND_ORIGIN_2}
    - ${FRONTEND_ORIGIN_3}
    - ${FRONTEND_ORIGIN_4}
    - ${FRONTEND_ORIGIN_5}
aws:
  region: ${AWS_REGION}
  bucket-name: ${AWS_BUCKET_NAME}
